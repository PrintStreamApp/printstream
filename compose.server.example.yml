# Copy this file to compose.yml for a real deployment and keep the
# server-specific copy out of git.

# Cap container log growth: json-file logs are unbounded by default, so a chatty
# or crash-looping container can fill the disk over time. Every service below
# references this anchor via `logging: *default-logging` (50 MB max per container).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    logging: *default-logging
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: printstream
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d printstream"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - printstream-postgres-data:/var/lib/postgresql/data

  # The combined app image (web + API + bridge); the entrypoint runs the API by
  # default and the `bridge` service below reuses the same image with a command.
  api:
    logging: *default-logging
    image: ghcr.io/printstreamapp/printstream:latest
    # To build from source instead of pulling, uncomment and run `docker compose up -d --build`:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     BRIDGE_BUILD_REVISION: ${BRIDGE_BUILD_REVISION:-unknown}
    #     PRINTSTREAM_BRIDGE_SOURCE_FINGERPRINT: ${PRINTSTREAM_BRIDGE_SOURCE_FINGERPRINT:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Single web-facing port. The API serves the built web SPA (SERVE_WEB_DIR is
    # baked into the image) alongside /api and /ws, so one container fronts the
    # whole app, no separate nginx. To run the API behind your own web tier
    # instead, set SERVE_WEB_DIR= (empty) below.
    ports:
      - "${PORT:-8080}:4000"
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/printstream?schema=public}
      # Only needed when the web app is served from a DIFFERENT origin than the
      # API (a split topology with your own web tier). This single-container
      # stack serves both from one origin, where browsers never consult CORS.
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-}
      # Other durable stores default to siblings of this path, so it must stay
      # on the mounted volume rather than the container filesystem.
      LIBRARY_DIR: /data/library
      # Built-in whole-install backups (database dump + stored files), written
      # to a host directory OUTSIDE the app's volumes (bind-mounted below) so
      # recreating containers or wiping volumes never takes the backups with
      # it. Set the interval to 0 for manual-only backups from Settings.
      BACKUPS_DIR: /backups
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      # Bridge release artifacts (published by CI, promoted by deploys) live in
      # the repo checkout and are bind-mounted so the API can serve them.
      BRIDGE_RELEASES_DIR: /data/bridge-releases
      # Accepts a comma-separated list of identical slicer instances to slice in
      # parallel (add a second slicer service with its own bounded work tmpfs and list
      # both URLs). Concurrency defaults to one job per listed instance;
      # SLICING_MAX_QUEUED_JOBS defaults to 25. See docs/configuration.md.
      SLICER_SERVICE_URL: ${SLICER_SERVICE_URL:-http://slicer:4010}
      SLICER_SERVICE_TOKEN: ${SLICER_SERVICE_TOKEN:-}
      SLICING_MAX_CONCURRENT_JOBS: ${SLICING_MAX_CONCURRENT_JOBS:-}
      SLICING_MAX_QUEUED_JOBS: ${SLICING_MAX_QUEUED_JOBS:-}
      PLUGINS_DIR: /data/plugins
      DISCOVERY_PORT: ${DISCOVERY_PORT:-2021}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Managed-bridge mode, ON by default for this single-host stack: the
      # bundled bridge auto-pairs on first start and the Bridges settings page
      # is hidden: nothing to configure, no secret, no pairing step. The API
      # auto-generates a provisioning token at MANAGED_BRIDGE_TOKEN_FILE on the
      # shared `printstream-provision` volume and the bridge reads it from the
      # same path. Set MANAGED_BRIDGE=false only to manage bridges by hand
      # (multiple bridges, or a bridge on another host).
      MANAGED_BRIDGE: ${MANAGED_BRIDGE:-true}
      MANAGED_BRIDGE_TOKEN_FILE: /run/provision/managed-bridge-token
      NTFY_TOPIC_URL: ${NTFY_TOPIC_URL:-}
      # Content-Security-Policy: report-only by default; set CSP_ENFORCE=true
      # once your deployment shows no violations (watch for `[csp-report]`
      # lines in the API log). If you embed a first-party analytics tracker,
      # allow its origin via CSP_ANALYTICS_ORIGIN.
      CSP_ENFORCE: ${CSP_ENFORCE:-}
      CSP_ANALYTICS_ORIGIN: ${CSP_ANALYTICS_ORIGIN:-}
      # ONLY when you put a reverse proxy in front: set to the number of hops
      # (e.g. 1 for a single nginx) so `req.ip`/`req.protocol` reflect the real
      # client. This stack exposes the port directly, and trusting
      # X-Forwarded-* with no proxy lets clients spoof their address to the
      # rate limiter, so it stays off by default.
      TRUST_PROXY: ${TRUST_PROXY:-}
    healthcheck:
      # Readiness (DB-aware): keeps dependents from starting against a DB-less API.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - printstream-data:/data
      - ./data/bridge-releases:/data/bridge-releases
      # Server backups. The container runs as uid 1000; if Docker creates this
      # host directory it will be root-owned and backups fail with a permission
      # error. Create it first: mkdir -p backups && chown 1000:1000 backups
      - ${APP_BACKUP_HOST_DIR:-./backups}:/backups
      # Carries the auto-generated managed-bridge provisioning token to the
      # bundled bridge. The API (which mounts this first via depends_on) owns it.
      - printstream-provision:/run/provision
    networks:
      - default
      - slicer-internal

  slicer:
    logging: *default-logging
    image: ghcr.io/printstreamapp/printstream-slicer:latest
    # build:
    #   context: .
    #   dockerfile: apps/slicer/Dockerfile
    restart: unless-stopped
    # Run an init (tini) as PID 1. The CLI launcher runs helper processes (a per-slice
    # weston; qemu on arm64) that can become zombies when a slice is cancelled mid-flight;
    # node-as-PID-1 never reaps them and they accumulate until the slicer can't start new
    # slices or serve profiles. tini reaps.
    init: true
    environment:
      SLICER_PORT: 4010
      SLICER_SERVICE_TOKEN: ${SLICER_SERVICE_TOKEN:-}
      SLICER_REQUIRE_AUTH: "true"
      SLICER_MAX_INPUT_BYTES: ${SLICER_MAX_INPUT_BYTES:-536870912}
      SLICER_MAX_INFLATED_BYTES: ${SLICER_MAX_INFLATED_BYTES:-2147483648}
      SLICER_MAX_ARCHIVE_ENTRIES: ${SLICER_MAX_ARCHIVE_ENTRIES:-4096}
      SLICER_MAX_OUTPUT_BYTES: ${SLICER_MAX_OUTPUT_BYTES:-1073741824}
      SLICER_DEFAULT_TARGET_ID: ${SLICER_DEFAULT_TARGET_ID:-}
      SLICER_CLI_ARGS_TEMPLATE: ${SLICER_CLI_ARGS_TEMPLATE:---slice {plate} --debug 2 --outputdir {outputDir} --min-save --export-3mf {outputFileName} --export-json {input} {input}}
      SLICER_ENABLE_PIPE_PROGRESS: ${SLICER_ENABLE_PIPE_PROGRESS:-true}
      SLICER_WORK_DIR: /work
      SLICER_BAMBUSTUDIO_HOME_DIR: /work/bambustudio-home
      SLICER_BAMBUSTUDIO_DATA_DIR: /work/bambustudio-data
      # Engines to fetch on first start: a comma-separated list of ids, or
      # `all`. Unset means just the current default (~530 MB), which is what
      # most installs want; add others in Settings, then Slicing.
      SLICER_PRELOAD_ENGINES: ${SLICER_PRELOAD_ENGINES:-}
    ports:
      - "${SLICER_BIND_HOST:-127.0.0.1}:${SLICER_BIND_PORT:-4010}:4010"
    # The native engine parses hostile projects. Keep its kernel and host impact bounded even if a
    # malformed file reaches a vulnerability in BambuStudio.
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      # The root service uses these only to migrate mount ownership and drop native children to
      # private per-job identities. DAC_OVERRIDE lets it remove mode-0700 files a crashed native
      # child left in its disposable tree; capabilities are cleared during the uid transition.
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: ${SLICER_PIDS_LIMIT:-512}
    mem_limit: ${SLICER_MEMORY_LIMIT:-8g}
    cpus: ${SLICER_CPU_LIMIT:-4.0}
    tmpfs:
      - /tmp:size=64m,mode=1777
      # Every work artifact is disposable. A memory-backed filesystem gives the entire native
      # boundary a hard storage ceiling, so arbitrary code cannot fill the host disk by spreading
      # writes across many files to evade the per-file rlimit.
      - /work:size=${SLICER_WORK_LIMIT:-4g},mode=0755
    volumes:
      # Slicing engines (Bambu Studio builds), downloaded on demand rather than
      # baked into the image. A BIND mount, not a named volume, so you choose
      # which disk carries them: each engine is roughly 530 MB installed, and the
      # first start downloads one before slicing works. Add and remove them in
      # Settings; what you install here survives image updates.
      - ./data/slicer-engines:/data/engines
    networks:
      - slicer-internal

  # Reuses the combined app image (built by `api`) and runs the bridge role.
  bridge:
    logging: *default-logging
    image: ghcr.io/printstreamapp/printstream:latest
    command: ["bridge"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BRIDGE_SERVER_URL: ${BRIDGE_SERVER_URL:-http://api:4000}
      DISCOVERY_PORT: ${DISCOVERY_PORT:-2021}
      BRIDGE_LIBRARY_DIR: /data/library
      BRIDGE_NAME: ${BRIDGE_NAME:-PrintStream Bridge}
      BRIDGE_STATE_FILE: /data/bridge-state.json
      # Daily on-disk backups of the bridge's identity + library files, written
      # to a host directory OUTSIDE the app's volumes (bind-mounted below) so
      # recreating containers or wiping volumes never takes the only copy of
      # your files with it. Set to 0 hours for manual-only backups.
      BRIDGE_BACKUP_DIR: /backups
      BRIDGE_BACKUP_INTERVAL_HOURS: ${BRIDGE_BACKUP_INTERVAL_HOURS:-24}
      # Reads the API-generated provisioning token from the shared mount so the
      # managed server auto-pairs this bridge. Harmless when MANAGED_BRIDGE is
      # off (the file simply won't exist).
      MANAGED_BRIDGE_TOKEN_FILE: /run/provision/managed-bridge-token
    # NOTE: Bridge-owned SSDP discovery requires receiving LAN multicast
    # packets. If you need auto-discovery from inside Docker, change this
    # service to `network_mode: host` and point `BRIDGE_SERVER_URL` at an
    # API address reachable from the host network.
    volumes:
      - printstream-bridge-data:/data
      # The container runs as uid 1000; if Docker creates this host directory
      # it will be root-owned and backups fail with a permission error. Create
      # it first: mkdir -p bridge-backups && chown 1000:1000 bridge-backups
      - ${BRIDGE_BACKUP_HOST_DIR:-./bridge-backups}:/backups
      - printstream-provision:/run/provision:ro

volumes:
  printstream-data:
    name: ${APP_DATA_VOLUME_NAME:-printstream-data}
  printstream-bridge-data:
    name: ${BRIDGE_DATA_VOLUME_NAME:-printstream-bridge-data}
  printstream-provision:
    name: ${PROVISION_VOLUME_NAME:-printstream-provision}
  printstream-postgres-data:
    name: ${POSTGRES_DATA_VOLUME_NAME:-printstream-postgres-data}

networks:
  slicer-internal:
    internal: true
