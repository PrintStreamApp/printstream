# Publishes the open-core Docker images to GHCR so self-hosters can `docker pull`
# instead of building from source. Rolling model: every push to the public repo's
# `main` (i.e. each `npm run export:public` snapshot) publishes the SemVer from
# the root package.json, moves `:latest` for stable versions, and retains an immutable `:sha-<short>`
# provenance tag. After all three images land, the same workflow creates the
# matching GitHub Release. A new snapshot must bump the version: two different
# source trees are never allowed to claim the same SemVer.
#
# Three images:
#   printstream          - the combined app (web + API + bridge in one image; the
#                          entrypoint runs `api` by default or `bridge` on demand).
#                          Published multi-arch (linux/amd64 + linux/arm64) so it
#                          runs on Raspberry Pi / ARM NAS as well as x86 hosts.
#   printstream-bridge   - the slim, bridge-only image (Dockerfile `bridge` target):
#                          a single esbuild-bundled runtime on the base image, for
#                          running just a LAN bridge host. Also multi-arch.
#   printstream-slicer   - the optional server-side slicer. It bundles the x86
#                          Bambu Studio CLI; on arm64 that CLI runs under qemu-user
#                          emulation against a baked x86-64 sysroot, so this image is
#                          also published multi-arch (native runner per arch).
#
# arm64 is built NATIVELY on GitHub's `ubuntu-24.04-arm` runners rather than under
# QEMU emulation: emulated Node + native-dep builds (the Prisma query engine in
# particular) are slow and flaky, and `prisma generate` reliably failed under
# emulation. Building each arch on its own CPU also bakes the matching native
# Prisma engine into each image, so no `binaryTargets` entry is required in
# schema.prisma. Per-arch images are pushed by digest, then merged into a single
# multi-arch tag (`docker buildx imagetools create`).
#
# This file ships into the public repo via the snapshot export and is GUARDED to
# run ONLY there: the private monorepo deploys over SSH and must never publish an
# image built from private (cloud) source.
name: Publish Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

# Every snapshot is a versioned release. Let each one finish so a later push
# cannot leave the earlier SemVer with only part of its image set published.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'PrintStreamApp/printstream'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.product.outputs.version }}
      tag: ${{ steps.product.outputs.tag }}
      prerelease: ${{ steps.product.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: product
        name: Read and validate the product version
        run: |
          version="$(node scripts/ci/product-version.mjs)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to reuse a version for different source
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.product.outputs.tag }}
          VERSION: ${{ steps.product.outputs.version }}
        run: |
          if [ -n "$BEFORE_SHA" ] \
            && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE_SHA}:package.json" 2>/dev/null; then
            previous_version="$(git show "${BEFORE_SHA}:package.json" | node -e "let source=''; process.stdin.on('data', chunk => source += chunk); process.stdin.on('end', () => console.log(JSON.parse(source).version))")"
            if [ "$previous_version" = "$VERSION" ] && [ "$BEFORE_SHA" != "$GITHUB_SHA" ]; then
              printf '%s\n' "Public source changed without a product version bump (${VERSION})." >&2
              exit 1
            fi
          fi

          if existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>tag-error.txt)"; then
            tag_status=0
          else
            tag_status=$?
            # gh can write the HTTP error body to stdout. It is not a tag object.
            existing_sha=''
          fi
          if [ "$tag_status" -ne 0 ] && ! grep -q '(HTTP 404)' tag-error.txt; then
            cat tag-error.txt >&2
            exit "$tag_status"
          fi
          if [ -n "$existing_sha" ] && [ "$existing_sha" != "$GITHUB_SHA" ]; then
            printf '%s\n' "${TAG} already points at ${existing_sha}; bump package.json before publishing a new image set." >&2
            exit 1
          fi

  # Build the combined app image once per architecture on a native runner and
  # push each result by digest (no tag yet: the merge job assembles the tags).
  build-app:
    needs: version
    # Only the public open-core repo publishes; skipped in the private mirror.
    if: github.repository == 'PrintStreamApp/printstream'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/printstreamapp/printstream

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the running-image identity for the footer version + GHCR update
          # hint. PUBLISHED=true marks this as the open-core image with a registry
          # update channel; REVISION is the commit shown to users.
          build-args: |
            PRINTSTREAM_IMAGE_REVISION=${{ github.sha }}
            PRINTSTREAM_IMAGE_VERSION=${{ needs.version.outputs.version }}
            PRINTSTREAM_IMAGE_PUBLISHED=true
          outputs: type=image,name=ghcr.io/printstreamapp/printstream,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=printstream-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=printstream-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-printstream-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      # The slim, bridge-only image (Dockerfile `bridge` target): the published
      # image people pull to run just a LAN bridge, without the API/web/Prisma
      # weight of the combined image. Same multi-arch + push-by-digest pattern.
      - id: build-bridge
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: bridge
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/printstreamapp/printstream-bridge,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=printstream-bridge-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=printstream-bridge-${{ matrix.arch }}

      - name: Export bridge digest
        run: |
          mkdir -p "${{ runner.temp }}/digests-bridge"
          digest="${{ steps.build-bridge.outputs.digest }}"
          touch "${{ runner.temp }}/digests-bridge/${digest#sha256:}"

      - name: Upload bridge digest
        uses: actions/upload-artifact@v4
        with:
          name: bridge-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests-bridge/*
          if-no-files-found: error
          retention-days: 1

  # Merge the per-arch digests into a single multi-arch manifest and tag it.
  merge-app:
    needs: [version, build-app]
    if: github.repository == 'PrintStreamApp/printstream'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-printstream-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/printstreamapp/printstream
          tags: |
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,format=short

      - name: Create multi-arch manifest and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/printstreamapp/printstream@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect "ghcr.io/printstreamapp/printstream:${{ needs.version.outputs.version }}"

  # Merge the per-arch bridge digests into a single multi-arch manifest and tag it.
  merge-bridge:
    needs: [version, build-app]
    if: github.repository == 'PrintStreamApp/printstream'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: bridge-digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/printstreamapp/printstream-bridge
          tags: |
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,format=short

      - name: Create multi-arch manifest and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/printstreamapp/printstream-bridge@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect "ghcr.io/printstreamapp/printstream-bridge:${{ needs.version.outputs.version }}"

  # The slicer bundles the x86 Bambu Studio CLI. On arm64 that CLI runs under
  # qemu-user emulation against an x86-64 sysroot baked into the image at build time
  # (apps/slicer/Dockerfile), so the image is published multi-arch like the app image:
  # build each arch on its own native runner, push by digest, then merge into one tag.
  # Building natively (not under QEMU) keeps the arm64 build's npm install and the
  # sysroot apt closure on a real arm64 CPU.
  build-slicer:
    needs: version
    if: github.repository == 'PrintStreamApp/printstream'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/printstreamapp/printstream-slicer

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/slicer/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/printstreamapp/printstream-slicer,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=printstream-slicer-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=printstream-slicer-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: slicer-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge the per-arch slicer digests into a single multi-arch manifest and tag it.
  merge-slicer:
    needs: [version, build-slicer]
    if: github.repository == 'PrintStreamApp/printstream'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: slicer-digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/printstreamapp/printstream-slicer
          tags: |
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,format=short

      - name: Create multi-arch manifest and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/printstreamapp/printstream-slicer@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect "ghcr.io/printstreamapp/printstream-slicer:${{ needs.version.outputs.version }}"

  release:
    needs: [version, merge-app, merge-bridge, merge-slicer]
    if: github.repository == 'PrintStreamApp/printstream'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the matching GitHub release once
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; image publication retry is complete."
            exit 0
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            --jq '.body' > generated-notes.md

          {
            printf '%s\n\n' '## Container images'
            printf '%s\n' '```console'
            printf 'docker pull ghcr.io/printstreamapp/printstream:%s\n' "$VERSION"
            printf 'docker pull ghcr.io/printstreamapp/printstream-bridge:%s\n' "$VERSION"
            printf 'docker pull ghcr.io/printstreamapp/printstream-slicer:%s\n' "$VERSION"
            printf '%s\n\n' '```'
            printf '%s\n\n' 'All three tags identify the image set built from this release commit. The `sha-` tags remain available for immutable provenance.'
            cat generated-notes.md
          } > release-notes.md

          release_args=()
          if [ "$PRERELEASE" = "true" ]; then
            release_args+=(--prerelease)
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${release_args[@]}"
