name: CI

# Runs shared repository validation (lint, tests, typecheck, prisma validate)
# and a production build. Platform-specific companion checks own separate
# workflows so a broken Android runner cannot make unrelated release evidence
# look red. Push-to-main coverage matters for the public repo, which receives
# snapshot exports as direct pushes to main rather than PRs.
#
# Also a reusable gate (CI-4): every publishing workflow calls this as its first job
# (`uses: ./.github/workflows/ci.yml`) and its publish jobs need it, so nothing ships
# from a tree this has not passed. `staging` is covered because staging images and
# packages are built from it.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_call:

# Least privilege by default (CI-5): jobs that need more widen it at job level.
permissions:
  contents: read

# The workflow name is part of the group because, when another workflow calls this one as
# its gate, `github.workflow` is the caller's: without it the caller's gate and this
# workflow's own push run would share a group on the same ref and cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Cap the job so a wedged step (e.g. a hung test or a stuck DB wait) fails the
    # run instead of burning a full 6h runner. The suite's own per-test timeout
    # (run-tests.mjs --test-timeout) is the first line of defense; this is the backstop.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: printstream
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d printstream"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/printstream?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client and apply migrations
        run: |
          npm run db:generate
          npx devkit-wait-for-db
          node scripts/bootstrap-prisma-migrations.mjs

      # validate's Store hero check draws text with devkit's pinned fonts (about 27 MB),
      # which it would otherwise download on every run. The key follows the lockfile,
      # so a devkit update that changes the pins starts a fresh cache.
      - name: Cache devkit fonts
        uses: actions/cache@v6
        with:
          path: ~/.cache/devkit/fonts
          key: devkit-fonts-${{ hashFiles('package-lock.json') }}
          restore-keys: devkit-fonts-

      # Tests resolve workspace packages through their built dist entry points.
      - name: Build and validate
        run: npm run build && npm run validate

  # The installer window and the tray are PowerShell programs written inside
  # TypeScript template literals, so nothing above can see them: tsc and the
  # linter both see a string. A syntax error there reaches a user as a window
  # that never appears, and a lone backslash is eaten by the template literal:
  # `'\s+'` becomes `'s+'`, which shipped once and would have replaced the letter
  # "s" with a space in every message the installer printed.
  #
  # Rendered on Linux (the generators are plain TS) and parsed here, on the only
  # runner that has a PowerShell parser to hand.
  powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Build the SEA runtime
        run: npm run build --workspace @printstream/sea-runtime

      - name: Render the generated PowerShell
        run: node scripts/ci/render-powershell.mjs rendered-powershell

      - name: Parse it
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem rendered-powershell -Filter *.ps1 | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              foreach ($e in $errors) {
                # Annotated so the failure points at the line, not just the file.
                Write-Host "::error file=$($_.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            } else {
              Write-Host "ok  $($_.Name)"
            }
          }
          if ($failed) { exit 1 }
